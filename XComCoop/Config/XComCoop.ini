; =====================================================================================
;  XComCoop.ini: alle tall og innstillinger for co-op-moden.
;  Leses av XComCoop_Config.uc (config(Coop) -> XComCoop.ini).
;  Se DESIGN.md for begrunnelser.
;
;  Verdier merket FORSLAG er ikke bestemt i designet ennå.
;  Kommentarer står alltid på egen linje (UE3 støtter ikke kommentarer bak verdier).
; =====================================================================================

[XComCoop.XComCoop_Config]

; -------------------------------------------------------------------------------------
;  Nettverk og tilkobling
; -------------------------------------------------------------------------------------
; Økes når meldingsformatet endres. Ulik versjon = kan ikke koble til.
ProtocolVersion=1
MaxPlayers=2

; Modliste sjekkes ved tilkobling. Mods i listen under ignoreres i sjekken
; (f.eks. rene UI-mods som ikke påvirker game state). Bruk DLCName.
bRequireIdenticalModList=true
;+ModsIgnoredInCompatCheck="NavnPaaUIMod"

; Port for spilltilkoblingen over Steam (verten lytter, klienten kobler til).
NetPort=7777
; Klienten ber verten om tilkobling med så mange sekunders mellomrom, og så mange ganger,
; før den gir opp.
ConnectRetrySeconds=2.0
ConnectAttempts=10

; Når klienten har gått, starter verten tjeneren på nytt etter så mange sekunder.
ServerRestartDelaySeconds=0.5
; Steam-relé for co-op-forbindelsen. Spillet slår det av når Steam starter, og uten relé må
; maskinene nå hverandre direkte gjennom ruterne. Det feilet mellom to vanlige hjemmenett.
; true: moden slår reléet på før den kobler til, og av igjen når økten avsluttes.
bAllowSteamRelay=true
; Lokal test med to kopier av spillet på samme PC (samme Steam-konto). CoopHostLocal og
; CoopJoinLocal kobler over vanlig IP i stedet for Steam, og klientkopien kobler til denne
; adressen. Vanlig co-op går alltid over Steam.
LocalTestAddress=127.0.0.1

; FORSLAG
HeartbeatIntervalSeconds=2.0
; FORSLAG: så lenge uten svar før det regnes som brudd.
DisconnectTimeoutSeconds=15.0
; FORSLAG: tidsvindu for ny tilkobling etter brudd. 0 = ingen grense.
ReconnectWindowSeconds=0

; Når klienten har fått kampanjen, venter den så mange sekunder før Avengeren lastes,
; så bekreftelsen til verten rekker å bli sendt.
CampaignLoadDelaySeconds=1.0

; Speiling (fase 2): verten sender endringer i kampanjen så mange sekunder etter den første
; endringen, så flere endringer går ut samlet.
MirrorSendDelaySeconds=0.5
; Verten venter så lenge på kvittering for en oppdatering før den sender neste likevel.
MirrorAckTimeoutSeconds=15.0
; Klienten fjerner sine egne endringer så ofte (sekunder). Må være større enn 0.
MirrorGuardSeconds=0.5
; Er kampanjene ulike etter en oppdatering, sender verten hele kampanjen på nytt, høyst så
; mange ganger per økt.
MirrorMaxResyncs=3
; Klokken på jordkloden går bare i minnet og lagres når tiden stopper. Verten sender den
; så ofte (sekunder) når den har flyttet seg, så klokken hos klienten følger med.
MirrorClockSeconds=0.5
; Avengeren, Skyrangeren og UFO-er flytter seg uten å lage nye tilstander. Mens noe flyr,
; sender verten posisjonen så ofte (sekunder), og klienten glir jevnt mellom punktene.
MirrorMoverSeconds=0.1
; Klienten tegner skjermen han ser på (Research, Armory osv.) på nytt etter endringer,
; høyst så ofte (sekunder), så listene ikke hopper hele tiden mens verten scanner.
OpenScreenRefreshSeconds=1.0
; Bare verten kjører tiden. Så ofte (sekunder) holder klienten sin egen tid stoppet.
ClientTimeFreezeSeconds=0.02

; -------------------------------------------------------------------------------------
;  Brukergrensesnitt
; -------------------------------------------------------------------------------------
; Hovedmenyen bygger knappene sine på nytt innimellom. Så ofte (sekunder) sjekkes det at
; CO-OP-knappen fortsatt er der.
MainMenuButtonCheckSeconds=0.5
; Så ofte (sekunder) co-op-skjermen ser etter endringer i lobbyen.
LobbyRefreshSeconds=0.25

; -------------------------------------------------------------------------------------
;  Strategi og Avenger
; -------------------------------------------------------------------------------------
; FORSLAG: myk lås på soldat som redigeres slippes etter så mange sekunder uten aktivitet.
SoldierSoftLockTimeoutSeconds=120.0

; Ett oppdrag om gangen.
MaxConcurrentMissions=1

; -------------------------------------------------------------------------------------
;  Taktisk co-op
; -------------------------------------------------------------------------------------
; Troppen deles likt. Ved oddetall får den som startet oppdraget den ekstra soldaten.
bExtraSoldierToMissionStarter=true

; Ved brudd overtar den andre spilleren soldatene til den som falt ut.
bTransferUnitsOnDisconnect=true

; -------------------------------------------------------------------------------------
;  Bli med underveis
; -------------------------------------------------------------------------------------
bAllowJoinInProgress=true
; Soldater som kommer med Skyranger.
JoinBaseSoldiers=2
; Turer fra man blir med til soldatene lander.
JoinDelayTurns=2
MaxJoinsPerMission=1
bBlockJoinDuringEvac=true

; FORSLAG: pris for å bli med. Maks soldater = troppstørrelse + forsterkning.
JoinCostSupplies=25
JoinCostIntel=25

; FORSLAG: ADVENT-forsterkninger, antall fiender per soldat som blir med (avrundes opp).
AdventReinforcementsPerJoinedSoldier=1.0

; Resistance Order «Hot Drop»: trekkes fra JoinDelayTurns.
HotDropTurnReduction=1

; GTS Rapid Deployment I og II. RequiredRank: 3 = Sergeant, 6 = Major.
+RapidDeploymentTiers=(ExtraSoldiers=1, RequiredRank=3, SupplyCost=75)
+RapidDeploymentTiers=(ExtraSoldiers=1, RequiredRank=6, SupplyCost=150)

; -------------------------------------------------------------------------------------
;  Kampanje
; -------------------------------------------------------------------------------------
; Ingen Ironman i v1.
bAllowIronman=false
; Pinger kommer senere.
bEnablePings=false

; Oppdrag som krever begge spillerne fra start.
+MissionSourcesRequiringBothPlayers=MissionSource_AvengerDefense
+MissionSourcesRequiringBothPlayers=MissionSource_ChosenAvengerAssault
+MissionSourcesRequiringBothPlayers=MissionSource_Final

; -------------------------------------------------------------------------------------
;  Fase 0-tester (fjernes når fase 0 er ferdig)
; -------------------------------------------------------------------------------------
; Port for testtilkoblingen over Steam (CoopNetHost / CoopNetJoin).
TestNetPort=7777
; Klienten ber verten om tilkobling med så mange sekunders mellomrom, og så mange ganger.
TestConnectRetrySeconds=2.0
TestConnectAttempts=10
